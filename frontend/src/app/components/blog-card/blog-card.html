<article class="bc-card" (click)="onClick()">
  <div class="bc-thumb">
    <img
      src="{{ blogInfo.thumbnail_url.url }}"
      alt="{{ blogInfo.thumbnail_url.alt }}"
      class="bc-img"
    />
    <span class="bc-badge">DECOR</span>
  </div>
  <div class="bc-body">
    <h2 class="bc-title">{{ blogInfo.title }}</h2>
    <p class="bc-excerpt">{{ blogInfo.description }} ...</p>

    <!-- ── Meta ── -->
    <div class="bc-meta">
      <span class="bc-meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        {{ formatPublishedAt() }}
      </span>
      <span class="bc-meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 6v6l4 2" />
        </svg>
        {{ blogInfo.time_reads }} phút
      </span>
    </div>
  </div>
</article>
