<div class="container">
  <div class="newest-section">
    <div class="position-relative text-center mb-3">
      <div>
        <div class="section-header">
          <div class="section-label">HÀNG MỚI VỀ</div>
          <h2 class="section-title">Sản Phẩm <span class="highlight">Mới Nhất</span></h2>
        </div>
        <p class="section-description">
          Khám phá bộ sưu tập nội thất mới nhất với thiết kế hiện đại, chất lượng cao, phù hợp với
          mọi không gian sống và làm việc theo tiêu chuẩn quốc tế
        </p>
      </div>
      <div class="section-actions position-absolute end-0 top-50 translate-middle-y">
        <button class="btn-view-all" (click)="onClick()">Xem Tất Cả</button>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="products-grid">
      <!-- Left: Discount Banner -->
      <div class="discount-banner">
        <div class="banner-content">
          <h3 class="banner-title">Giảm Giá</h3>
          <div class="banner-discount">50%</div>
          <button class="banner-btn">Mua Ngay <i class="fas fa-arrow-right"></i></button>
        </div>
      </div>

      <!-- Right: Product Cards -->
      <div class="product-cards-grid">
        <!-- Product 1 -->
        @for (product of listNewsProducts; track $index) {
          <app-card-product [productInfo]="product"></app-card-product>
        }
      </div>
    </div>
  </div>
</div>
