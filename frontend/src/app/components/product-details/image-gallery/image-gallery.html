<!-- image-gallery.component.html -->
@if (images.length > 0) {
  <div class="ig-gallery">
    <!-- ── Row type A: 2 equal columns ── -->
    @for (row of layoutRows; track $index) {
      <ng-container>
        <!-- Layout: 2 equal [img, img] -->
        @if (row.type === 'half') {
          <div class="ig-row ig-row--half">
            @for (item of row.items; track $index) {
              <div class="ig-cell">
                <img
                  [src]="item"
                  [alt]="item"
                  class="ig-img"
                  loading="lazy"
                  (click)="openLightbox(item)"
                />
              </div>
            }
          </div>
        }

        <!-- Layout: 1 small left + 1 large right [1/3 | 2/3] -->
        @if (row.type === 'featured') {
          <div class="ig-row ig-row--featured">
            <div class="ig-cell ig-cell--small">
              <img
                [src]="row.items[0]"
                [alt]="row.items[0]"
                class="ig-img"
                loading="lazy"
                (click)="openLightbox(row.items[0])"
              />
            </div>
            <div class="ig-cell ig-cell--large">
              <img
                [src]="row.items[1]"
                [alt]="row.items[1]"
                class="ig-img"
                loading="lazy"
                (click)="openLightbox(row.items[1])"
              />
            </div>
          </div>
        }
        @if (row.type === 'thirds') {
          <div class="ig-row ig-row--thirds">
            <div class="ig-cell" *ngFor="let item of row.items">
              <img
                [src]="item"
                [alt]="item"
                class="ig-img"
                loading="lazy"
                (click)="openLightbox(item)"
              />
            </div>
          </div>
        }
        <!-- Layout: 3 equal columns [img, img, img] -->

        <!-- Layout: 1 full width -->
        @if (row.type === 'full') {
          <div class="ig-row ig-row--full">
            <div class="ig-cell">
              <img
                [src]="row.items[0]"
                [alt]="row.items[0]"
                class="ig-img"
                loading="lazy"
                (click)="openLightbox(row.items[0])"
              />
            </div>
          </div>
        }
      </ng-container>
    }
  </div>
}

@if (lightboxItem) {
  <div class="ig-lightbox" (click)="closeLightbox()">
    <button class="ig-lightbox__close" (click)="closeLightbox()" aria-label="Đóng">✕</button>
    <img
      [src]="lightboxItem"
      [alt]="lightboxItem"
      class="ig-lightbox__img"
      (click)="$event.stopPropagation()"
    />
  </div>
}
