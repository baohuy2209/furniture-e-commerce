<section class="featured" id="featured-event">
  <p class="section-label">◆ SỰ KIỆN NỔI BẬT</p>

  <h2 class="section-title">
    Dang <span>Diễn Ra</span>
  </h2>

  <div class="featured-card">
    <!-- IMAGE -->
    <div class="featured-image">
      <span class="badge-live">● ĐANG DIỄN RA</span>
      <img [src]="event.thumbnail_image" [alt]="event.event_name" />
    </div>

    <!-- CONTENT -->
    <div class="featured-info">
      <p class="location">
        <i class="bi bi-geo-alt-fill"></i>
        {{ event.location }}
      </p>

      <h3>{{ event.event_name }}</h3>

      <p class="desc">
        {{ event.description }}
      </p>

      <div class="meta" *ngIf="event.stats">
        <div class="meta-item">
          <i class="bi bi-people-fill"></i>
          <b>{{ event.stats.attendees }}+</b>
          <span>Khách tham dự</span>
        </div>

        <div class="meta-item">
          <i class="bi bi-buildings"></i>
          <b>{{ event.stats.brands }}+</b>
          <span>Thương hiệu</span>
        </div>

        <div class="meta-item">
          <i class="bi bi-mic-fill"></i>
          <b>{{ event.stats.workshops }}</b>
          <span>Workshop</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" [routerLink]="['/events', event.event_id]">Xem chi tiết →</button>
        <button class="btn-outline" [disabled]="event.event_status === 'PAST'" (click)="openRegisterModal()">Đăng ký tham dự</button>
      </div>
    </div>
  </div>

  @if (isModalOpen) {
    <app-event-registration-modal 
      [event]="event" 
      (close)="closeRegisterModal()">
    </app-event-registration-modal>
  }
</section>
