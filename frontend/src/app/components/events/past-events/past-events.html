<section class="past">
  <p class="section-label">PAST EVENTS</p>

  <h2>Sự kiện <span>Đã Qua</span></h2>

  <!-- IMAGE GRID -->
  <div class="past-grid">
    @for (event of pastEvents; track event.event_id) {
      <a class="past-item" [routerLink]="['/events', event.event_id]">
        <img [src]="event.thumbnail_image" [alt]="event.event_name" />
      </a>
    }
  </div>

  <!-- RECAP VIDEO -->
  <div class="recap" id="video-section">
    <div class="recap-thumb" (click)="playVideo()">
      @if (!videoVisible) {
        <img src="/images/event/event_images1.jpg" alt="Recap 2024" />
        <!-- Ideally use a specific recap image if available -->
        <div class="play-btn"><i class="bi bi-play-fill"></i></div>
      } @else {
        <video
          src="/draft video.mp4"
          controls
          autoplay
          class="recap-video"
          style="width: 100%; height: 100%; border-radius: 20px; object-fit: cover"
        ></video>
      }
    </div>

    <div class="recap-content">
      <h3>Recap: HomeBase Events 2024</h3>
      <p>Xem lại những khoảnh khắc đáng nhớ nhất trong năm qua tại HomeBase.</p>

      <button class="btn" (click)="playVideo()">
        <i class="bi bi-play-circle"></i> Xem video đầy đủ
      </button>
    </div>
  </div>
</section>
