<section class="upcoming">

  <p class="section-label">UPCOMING EVENTS</p>

  <h2>Sự kiện <span>Sắp Tổ Chức</span></h2>

  <div class="grid">

    @for (event of events; track event.id) {

      <div class="event-card">

        <div class="thumb">
          <img [src]="event.image" [alt]="event.title" />

          <div class="date-badge">
            <b>{{ event.date.day }}</b>
            <span>THÁNG {{ event.date.month }}</span>
          </div>
        </div>

        <div class="content">

          <span class="tag">{{ event.type }}</span>

          <h4>{{ event.title }}</h4>

          <p>{{ event.description }}</p>

          <div class="meta">
            <span><i class="bi bi-clock"></i> {{ event.time }}</span>
            <span *ngIf="event.price === 0">Miễn phí</span>
            <span *ngIf="event.price > 0">{{ event.price | number }}đ</span>
          </div>

          <a class="more" [routerLink]="['/events', event.id]">Tìm hiểu thêm →</a>

        </div>

      </div>

    }

  </div>

</section>
