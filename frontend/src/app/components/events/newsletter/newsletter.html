<section class="newsletter-section">
  <div class="newsletter-container">
    <h2 class="newsletter-title">Đừng bỏ lỡ sự kiện tiếp theo</h2>
    <p class="newsletter-desc">Đăng ký nhận thông báo về các sự kiện mới nhất từ HomeBase</p>
    <form class="newsletter-form" (submit)="onSubmit($event)">
      <input type="email" placeholder="Nhập email của bạn" class="newsletter-input" />
      <button type="submit" class="newsletter-btn">
        ĐĂNG KÝ NGAY <i class="bi bi-arrow-right"></i>
      </button>
    </form>
  </div>
</section>
