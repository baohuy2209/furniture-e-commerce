<div class="google-container">
    <div class="google-card" *ngIf="!isLoading">
        <div class="logo-area">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" width="75">
        </div>

        <h1 class="title">Sign in</h1>
        <p class="subtitle">to continue to HomeBase</p>

        <div class="account-list">
            <div class="account-item" (click)="selectAccount('demo.user@gmail.com')">
                <div class="avatar">D</div>
                <div class="info">
                    <div class="name">Demo User</div>
                    <div class="email">demo.user@gmail.com</div>
                </div>
            </div>

            <div class="account-item" (click)="selectAccount('john.doe@gmail.com')">
                <div class="avatar purple">J</div>
                <div class="info">
                    <div class="name">John Doe</div>
                    <div class="email">john.doe@gmail.com</div>
                </div>
            </div>

            <div class="account-item add-account">
                <div class="avatar icon"><i class="fa-solid fa-user-plus"></i></div>
                <div class="info">
                    <div class="text">Use another account</div>
                </div>
            </div>
        </div>

        <div class="footer-text">
            To continue, Google will share your name, email address, and language preference with HomeBase.
        </div>

    </div>

    <div class="loading-state" *ngIf="isLoading">
        <div class="spinner"></div>
        <p>Signing in...</p>
    </div>
</div>
